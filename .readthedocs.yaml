version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.8"
  jobs:
    pre_install:
      - curl -fsSL https://pixi.sh/install.sh | bash
      - export PATH="$HOME/.pixi/bin:$PATH"
    post_install:
      - pixi install
      - pixi run build-docs

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true
