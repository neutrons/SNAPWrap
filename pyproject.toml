[project]
name = "snapwrap"
description = "Instrument Scientist Scripting Interface into SNAPRed"
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["neutrons", "example", "python"]
readme = "README.md"
dependencies = [
  "scikit-image",
  "panel >=1.7.0",
  "sqlalchemy >=2.0.0",
  "ruamel.yaml",
  "lmfit",
  "odfpy >=1.4.1",
  "h5py",
  "scipy",
  "python-dateutil",
  "packaging",
  "pyyaml",
]
    # PyPI dependencies

[project.urls]
homepage = "https://github.com/neutrons/python_project_template/"  # if no homepage, use repo url
repository = "https://github.com/neutrons/python_project_template/"
# documentation = add_url_to_readthedoc_here
issues = "https://github.com/neutrons/python_project_template/issues"

[project.scripts]
packagename-cli = "packagenamepy.packagename:main"

[project.gui-scripts]
packagenamepy = "packagenamepy.packagename:gui"

####################
### Build config ###
####################

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "versioningit"]

[tool.hatch.version]
source = "versioningit"

[tool.hatch.build.hooks.versioningit-onbuild]
source-file = "src/snapwrap/_version.py"
build-file = "snapwrap/_version.py"

[tool.hatch.build]
artifacts = [
  "src/snapwrap/_version.py",
  "src/snapwrap/**/*.yml",
  "src/snapwrap/**/*.yaml",
  "src/snapwrap/**/*.ini",
]

[tool.hatch.build.targets.wheel]
packages = ["src/snapwrap"]

[tool.versioningit.vcs]
method = "git"
default-tag = "0.1.0"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{next_version}.dev{committer_date:%Y%m%d%H%M%S}"
# Since pixi builds currently require the package version to be set statically in pyproject.toml,
# and we solve that by temporarily changing pyproject.toml during build using the pixi tasks
# sync-version and reset-toml, then we need to ignore uncommitted changes in order for the wheel
# version to be consistent with the package version
dirty = "{version}"
distance-dirty = "{next_version}.dev{committer_date:%Y%m%d%H%M%S}"

[tool.versioningit.write]
file = "src/snapwrap/_version.py"

# [tool.setuptools.packages.find]
