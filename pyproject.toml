###################
### Pixi config ###
###################

[tool.pixi.workspace]
preview = ["pixi-build"] # Required until the build feature becomes stable
channels = [
  "conda-forge", 
  "mantid/label/nightly", 
  "mantid-ornl", 
  "mantid-ornl/label/rc", 
  "neutrons", 
  "neutrons/label/rc",
  "https://prefix.dev/pixi-build-backends", # Required for pixi build
  "oncat",
]
platforms = ["linux-64", "osx-arm64"] # add additional platforms as needed

[tool.pixi.dependencies]
# TODO: This needs to be cleaned up, I'm not certain which deps are actually used.
snapred = ">2.0.0"
scikit-image = "*"
python = ">=3.10"
panel = ">=1.7.4,<2"
sqlalchemy = ">=2.0.41,<3"
versioningit = "*"
numpy = "*"
pandas = "*"
lmfit = "*"
matplotlib = "*"
jupyterlab = "*"
ipympl = "*"
pre-commit = "*"
libmamba = "*"
libarchive = "*"
anaconda-client = "*"
# conda-build 25+ drops the py-lief <0.15 constraint (CVE-2024-31636, CVE-2025-15504)
conda-build = ">=25"
python-build = "*"
# httpcore 1.0.9+ depends on h11 >=0.16 which fixes CVE-2025-43859
httpcore = ">=1.0.9"
twine = "*"
sphinx = "*"
sphinx_rtd_theme = "*"
myst-parser = "*"
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
pip = "*"
odfpy = ">=1.4.1"
h5py = "*"
scipy = "*"
python-dateutil = "*"
packaging = "*"
pyyaml = "*"
# NOTE: this dep SHOULD have been in snapred, but was missed
"ruamel.yaml" = "*"

[tool.pixi.pypi-dependencies]
snapwrap = { path = ".", editable = true }
bm3d-streak-removal = "*"
pytest-playwright = "*"

[tool.pixi.package.host-dependencies]
hatchling = "*"
versioningit = "*"
panel = ">=1.7.4,<2"
sqlalchemy = ">=2.0.41,<3"

[tool.pixi.package.run-dependencies]
python = ">=3.10"
numpy = "*"
QtPy = "*"
pyqt = "*"
pyqtgraph = "*"
scikit-image = "*"
lmfit = "*"
panel = ">=1.7.4,<2"
sqlalchemy = ">=2.0.41,<3"
snapred = ">2.0.0"
odfpy = ">=1.4.1"
h5py = "*"
scipy = "*"
python-dateutil = "*"
packaging = "*"
pyyaml = "*"
pandas = "*"
# NOTE: this dep SHOULD have been in snapred, but was missed
"ruamel.yaml" = "*"

[tool.pixi.package]
name = "snapwrap"
version = "0.0.0"     # placeholder, overwritten by sync-version

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "0.4.*" }

# Environments and Features

[tool.pixi.environments]
default = { features = [
  "docs",
  "developer",
  "package",
  "test",
], solve-group = "default" }
jupyter = { features = ["developer", "jupyter"], solve-group = "jupyter" }

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-repeat = "*"
pytest-xdist = "*"

[tool.pixi.feature.package.dependencies]
anaconda-client = ">=1.13.0,<2"
twine = ">=6.1.0,<7"
versioningit = "*"
hatch = "*"

[tool.pixi.feature.package.pypi-dependencies]
toml-cli = "*"

[tool.pixi.feature.developer.dependencies]
pip = "*"
pip-audit = "*"
pre-commit = "*"
ruff = "*"
versioningit = "*"

[tool.pixi.feature.docs.dependencies]
sphinx = "*"
sphinx_rtd_theme = "*"
myst-parser = "*"

[tool.pixi.feature.jupyter.dependencies]
jupyterlab = "*"
ipympl = "*"
ipywidgets = "*"

[tool.pixi.tasks]
snapwrap = { cmd = "pixi run python -m workbench", description = "Run the workbench in the snapwrap env" }

# Documentation tasks
build-docs = { cmd = "sphinx-build -b html docs docs/_build", description = "Build the documentation" }

# Testing tasks
test = { cmd = "pytest", description = "Run the tests" }  # pytest config above takes care of the arguments

# Packaging
pypi-build = { cmd = "hatch build", description = "Build the package for PyPI" }
pypi-publish = { cmd = "twine upload dist/*", description = "Publish the package to PyPI", depends-on = [
  "pypi-build",
] }
pypi-publish-test = { cmd = "twine upload --repository testpypi dist/*", description = "Publish the package to TestPyPI", depends-on = [
  "pypi-build",
] }
conda-build-command = { cmd = "pixi build", description = "Build the conda package command" }
conda-build = { description = "Build the conda package", depends-on = [
  "backup-toml",
  "sync-version",
  "conda-build-command",
  "reset-toml",
] }
conda-publish = { cmd = "anaconda upload *.conda", description = "Publish the .conda package to anaconda.org", depends-on = [
  "conda-build",
] }

# Misc
# tornado 6.5.5 fixes CVE-2026-31958 / GHSA-78cv-mqj4-43f7 but is not yet on conda-forge (latest: 6.5.4)
# Remove the --ignore-vuln flags once conda-forge packages tornado >=6.5.5
audit-deps = { cmd = "pip-audit --local -s osv --ignore-vuln GHSA-78cv-mqj4-43f7 --ignore-vuln CVE-2026-31958 --ignore-vuln CVE-2026-3219", description = "Audit the package dependencies for vulnerabilities" }
clean = { cmd = 'rm -rf .pytest_cache .ruff_cache **/*.egg-info **/dist **/__pycache__', description = "Clean up various caches and build artifacts" }
clean-conda = { cmd = "rm -f *.conda", description = "Clean the local .conda build artifacts" }
clean-docs = { cmd = "rm -rf docs/_build", description = "Clean up documentation build artifacts" }
clean-pypi = { cmd = "rm -rf dist", description = "Clean the PyPI build artifacts" }
clean-all = { description = "Clean all artifacts", depends-on = [
  "clean",
  "clean-conda",
  "clean-docs",
  "clean-pypi",
] }
sync-version = { cmd = 'version=$(python -m versioningit); toml set tool.pixi.package.version "$version" --toml-path pyproject.toml', description = "Sync pyproject.toml version with Git version" }
backup-toml = { cmd = "cp pyproject.toml pyproject.toml.bak", description = "Backup the pyproject.toml file" }
reset-toml = { cmd = "cp pyproject.toml.bak pyproject.toml; rm pyproject.toml.bak", description = "Reset the pyproject.toml file to the original state" }


##############
### Pytest ###
##############

[tool.pytest.ini_options]
addopts = "-v --cov=snapwrap --cov-report=term-missing"
pythonpath = [
  ".", "src", "scripts"
]
testpaths = ["tests"]
python_files = ["test*.py"]
norecursedirs = [".git", "tmp*", "_tmp*", "__pycache__", "*dataset*", "*data_set*"]
markers = [
    "mymarker: example markers goes here"
]

############
### Ruff ###
############

[tool.ruff]
line-length = 120
select = ["A", "ARG","ASYNC","BLE","C90", "E", "F", "I", "N", "UP032", "W"]
