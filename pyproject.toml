[project]
name = "snapwrap"
description = "Instrument Scientist Scripting Interface into SNAPRed"
dynamic = ["version"]
requires-python = ">=3.8"
license = "MIT"
keywords = ["neutrons", "neutron-scattering", "data-reduction", "snapred"]
readme = "README.md"
dependencies = ["scikit-image"]

[project.urls]
homepage = "https://github.com/neutrons/SNAPWrap/"
repository = "https://github.com/neutrons/SNAPWrap/"
issues = "https://github.com/neutrons/SNAPWrap/issues"

# No console scripts defined for snapwrap currently
# [project.scripts]
# snapwrap-cli = "snapwrap.main:main"

####################
### Build config ###
####################

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "versioningit"]

[tool.hatch.build.targets.wheel]
packages = ["src/snapwrap"]

# Package data files will be included automatically by hatchling
# from the package directories
[tool.hatch.build]
exclude = ["tests*", "scripts*", "docs*", "notebooks*"]

[tool.hatch.version]
source = "versioningit"

[tool.versioningit.vcs]
method = "git"
default-tag = "0.1.0"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}"
dirty = "{version}"
distance-dirty = "{next_version}.dev{distance}"

[tool.versioningit.write]
file = "src/snapwrap/_version.py"


###################
### Pixi config ###
###################

[tool.pixi.project]
authors = ["Michael Walsh <walshmm@ornl.gov>"]
platforms = ["linux-64"]
channels = [
  "conda-forge",
  "mantid/label/nightly",
  "mantid-ornl",
  "mantid-ornl/label/rc",
  "neutrons",
  "neutrons/label/rc",
  "https://prefix.dev/pixi-build-backends",
]
# Required until the build feature becomes stable
preview = ["pixi-build"]

[tool.pixi.package]
name = "snapwrap"
version = "0.1.0"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "0.1.*" }

[tool.pixi.package.host-dependencies]
hatchling = "*"
versioningit = "*"

[tool.pixi.pypi-dependencies]
snapwrap = { path = ".", editable = true }
bm3d-streak-removal = "*"
pytest-playwright = "*"
# build = "*"

[tool.pixi.dependencies]
snapred = ">=1.3.0"    # Available in neutrons channel
mantid = "*"           # Available in mantid/label/nightly channel
scikit-image = "*"
python = ">=3.8"
panel = ">=1.7.0"
sqlalchemy = ">=2.0.0"
numpy = "*"
pandas = "*"
matplotlib = "*"
jupyterlab = "*"
ipympl = "*"
h5py = "*"

# Environments and features

[tool.pixi.environments]
default = { features = [
  "build",
  "dev",
  "docs",
  "test",
], solve-group = "default" }
docs = { features = ["dev", "docs"], no-default-feature = true }
build = { features = ["build"], no-default-feature = true }

[tool.pixi.feature.build.dependencies]
anaconda-client = ">=1.13.0"
check-wheel-contents = ">=0.6.2"
versioningit = ">=3.3.0"

[tool.pixi.feature.build.pypi-dependencies]
toml-cli = "*"

[tool.pixi.feature.dev.dependencies]
pip = "*"
pip-audit = "*"
pre-commit = "*"

[tool.pixi.feature.docs.dependencies]
sphinx = "*"
sphinx_rtd_theme = "*"
myst-parser = "*"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"

[tool.pixi.tasks]
# Documentation
build-docs = { cmd = 'sphinx-build -b html docs docs/_build/html', description = "Build documentation" }
test-docs = { cmd = "sphinx-build -M doctest docs docs/_build/html", description = "Test building the documentation" }
# Testing
test = { description = "Run the test suite", cmd = "pytest" }
# Mantid Workbench
workbench = { cmd = "python -m workbench", description = "Launch Workbench" }
# Packaging
conda-build-command = { cmd = "pixi build", description = "Wrapper for building the conda package - used by `conda-build`" }
conda-build = { description = "Build the conda package", depends-on = [
  "sync-version",
  "conda-build-command",
  "reset-version",
] }
conda-publish = { cmd = "anaconda upload *.conda", description = "Publish the .conda package to anaconda.org", depends-on = [
  "conda-build",
] }
# Misc
audit-deps = { cmd = "pip-audit --local -s osv", description = "Audit the package dependencies for vulnerabilities" }
clean = { cmd = 'rm -rf .pytest_cache .ruff_cache **/*.egg-info **/dist **/__pycache__ **/_version.py', description = "Clean up various caches and build artifacts" }
clean-conda = { cmd = "rm -f *.conda", description = "Clean the local .conda build artifacts" }
clean-docs = { cmd = "rm -rf docs/_build", description = "Clean up documentation build artifacts" }
clean-all = { description = "Clean all artifacts", depends-on = [
  "clean",
  "clean-conda",
  "clean-docs",
] }
sync-version = { cmd = 'version=$(python -m versioningit); toml set tool.pixi.package.version "$version" --toml-path pyproject.toml', description = "Sync pyproject.toml version with Git version" }
reset-version = { cmd = "toml set tool.pixi.package.version \"0.1.0\" --toml-path pyproject.toml", description = "Reset the package version to 0.1.0" }


##########################
### Pytest and CodeCov ###
##########################

[tool.pytest.ini_options]
addopts = "-v --cov=snapwrap --cov-report=xml --cov-report=term-missing"
pythonpath = [".", "src", "scripts"]
testpaths = ["tests"]
python_files = ["test*.py"]
norecursedirs = [
  ".git",
  "tmp*",
  "_tmp*",
  "__pycache__",
  "*dataset*",
  "*data_set*",
]
markers = ["mymarker: example markers goes here"]

############
### Ruff ###
############

[tool.ruff]
line-length = 120
select = ["A", "ARG", "ASYNC", "BLE", "C90", "E", "F", "I", "N", "UP032", "W"]
