[project]
name = "snapwrap"
description = "Instrument Scientist Scripting Interface into SNAPRed"
dynamic = ["version"]
requires-python = ">=3.8"
license = "MIT"
keywords = ["neutrons", "neutron-scattering", "data-reduction", "snapred"]
readme = "README.md"
dependencies = [
  "scikit-image"
]

[project.urls]
homepage = "https://github.com/neutrons/SNAPWrap/"
repository = "https://github.com/neutrons/SNAPWrap/"
issues = "https://github.com/neutrons/SNAPWrap/issues"

[build-system]
requires = [
  "hatchling",
  "hatch-vcs"
]
build-backend = "hatchling.build"

# Versioningit configuration - now using hatch-vcs instead
# [tool.versioningit.vcs]
# method = "git"
# default-tag = "0.1.0"

# [tool.versioningit.next-version]
# method = "minor"

# [tool.versioningit.format]
# distance = "{next_version}.dev{distance}"
# dirty = "{version}+d{build_date:%Y%m%d}"
# distance-dirty = "{next_version}.dev{distance}+d{build_date:%Y%m%d%H%M}"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/snapwrap/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/snapwrap"]

[tool.hatch.build.targets.wheel.force-include]
"src/snapwrap" = "snapwrap"

[tool.hatch.build]
exclude = ["tests*", "scripts*", "docs*", "notebooks*"]

[tool.hatch.build.targets.wheel.shared-data]
"src/snapwrap/*.yml" = "snapwrap/"
"src/snapwrap/*.yaml" = "snapwrap/"
"src/snapwrap/*.ini" = "snapwrap/"
"src/snapwrap/*.css" = "snapwrap/"
"src/snapwrap/*.doctree" = "snapwrap/"
"src/snapwrap/*.html" = "snapwrap/"
"src/snapwrap/*.inv" = "snapwrap/"
"src/snapwrap/*.jpg" = "snapwrap/"
"src/snapwrap/*.js" = "snapwrap/"
"src/snapwrap/*.map" = "snapwrap/"
"src/snapwrap/*.md" = "snapwrap/"
"src/snapwrap/*.png" = "snapwrap/"
"src/snapwrap/*.po" = "snapwrap/"
"src/snapwrap/*.svg" = "snapwrap/"
"src/snapwrap/*.ttf" = "snapwrap/"
"src/snapwrap/*.txt" = "snapwrap/"
"src/snapwrap/*.woff2" = "snapwrap/"

# No console scripts defined for snapwrap currently
# [project.scripts]
# snapwrap-cli = "snapwrap.main:main"

[tool.pytest.ini_options]
addopts = "-v --cov=snapwrap --cov-report=xml --cov-report=term-missing"
pythonpath = [
  ".", "src", "scripts"
]
testpaths = ["tests"]
python_files = ["test*.py"]
norecursedirs = [".git", "tmp*", "_tmp*", "__pycache__", "*dataset*", "*data_set*"]
markers = [
    "mymarker: example markers goes here"
]

[tool.ruff]
line-length = 120
select = ["A", "ARG","ASYNC","BLE","C90", "E", "F", "I", "N", "UP032", "W"]

# Pixi configuration
[tool.pixi.project]
authors = ["Michael Walsh <walshmm@ornl.gov>"]
channels = ["conda-forge", "mantid/label/nightly", "mantid-ornl", "mantid-ornl/label/rc", "neutrons", "neutrons/label/rc"]
name = "snapwrap"
platforms = ["linux-64"]
version = "0.1.0"

[tool.pixi.pypi-dependencies]
snapwrap = { path = ".", editable = true }
bm3d-streak-removal = "*"
pytest-playwright = "*"

[tool.pixi.tasks]
# Conda packaging tasks
build-conda = { cmd = "pixi build", description = "Build the package for conda" }
clean-conda = { cmd = "rm -rf ./dist", description = "Clean the conda build artifacts" }
# Documentation tasks
build-docs = { cmd = "sphinx-build -b html docs docs/_build", description = "Build the documentation" }
clean-docs = { cmd = "rm -rf docs/_build", description = "Clean the documentation build artifacts" }
# Testing tasks
test = { cmd = "pytest", description = "Run the tests" }  # pytest config above takes care of the arguments
# Clean all
clean-all = { description = "Clean all build artifacts", depends-on = ["clean-conda", "clean-docs"] }

[tool.pixi.dependencies]
snapred = ">=1.3.0"  # Available in neutrons channel
mantid = "*"  # Available in mantid/label/nightly channel
scikit-image = "*"
python = ">=3.8"
panel = ">=1.7.0"
sqlalchemy = ">=2.0.0"
versioningit = "*"
numpy = "*"
pandas = "*"
matplotlib = "*"
jupyterlab = "*"
ipympl = "*"
pre-commit = "*"
libmamba = "*"
libarchive = "*"
anaconda-client = "*"
conda-build = "<4"
sphinx = "*"
sphinx_rtd_theme = "*"
myst-parser = "*"
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
pip = "*"
h5py = "*"
