# load information from pyproject.toml
{% set pyproject = load_file_data('pyproject.toml') %}
{% set project = pyproject.get('project', {}) %}
{% set license = project.get('license') %}
{% set description = project.get('description') %}
{% set project_url = pyproject.get('project', {}).get('urls') %}
{% set url = project_url.get('homepage') %}
# this will get the version set by environment variable
{% set version = environ.get('VERSION') %}
{% set version_number = version.split('+')[0] %}
# change the build number by hand if you want to rebuild the package
{% set build_number = 0 %}

package:
  name: snapwrap
  version: {{ version_number }}

source:
  path: ..

build:
  noarch: python
  number: {{ build_number }}
  string: py{{py}}
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vvv

requirements:
  host:
    - python >=3.8
    - versioningit
    - setuptools >=42
    - wheel
    - pip

  build:
    - python >=3.8
    - setuptools >=42
    - versioningit

  run:
    - python >=3.8
    - mantidworkbench
    - snapred >=1.3.0rc1
    - scikit-image
    - panel = ">=1.7.0"
    - sqlalchemy = ">=2.0.0"

test:
  imports:
    - snapwrap
  commands:
    - python -c "import snapwrap; print('SNAPWrap version:', snapwrap.__version__)"

test:
  imports:
    - snapwrap
  commands:
    - python -c "import snapwrap; print('SNAPWrap version:', snapwrap.__version__)"

about:
  home: {{ url }}
  license: {{ license }}
  license_family: GPL
  license_file: ../LICENSE
  summary: {{ description }}
